# Erzeugt die gesprochenen „Блять!“-Rufe (russische Piper-Stimmen), macht sie wütend/laut
# und legt sie unter audio/ ins Repository. Wird von Hand gestartet.
name: Bljat-Stimme erzeugen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sox libsox-fmt-mp3 ffmpeg > /dev/null
          pip install -q piper-tts==1.2.0

      - name: Russische Stimmen laden
        run: |
          mkdir -p voices
          for v in dmitri/medium/ru_RU-dmitri-medium denis/medium/ru_RU-denis-medium ruslan/medium/ru_RU-ruslan-medium; do
            base=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/ru/ru_RU/$v
            name=$(basename $v)
            curl -fsSL -o voices/$name.onnx "$base.onnx" || echo "fehlt: $name"
            curl -fsSL -o voices/$name.onnx.json "$base.onnx.json" || true
            curl -fsSL "$(dirname $base)/MODEL_CARD" | head -20 || true
          done
          ls -la voices

      - name: „Блять!“ sprechen und wütend machen
        run: |
          mkdir -p audio raw
          rm -f audio/bljat*.mp3
          i=0
          for m in voices/*.onnx; do
            [ -s "$m" ] || continue
            # einmal kurz und wütend, einmal lang gezogen gebrüllt
            for variant in "Блять!|1.0" "Бля-я-ять!|1.25"; do
              text="${variant%%|*}"; speed="${variant##*|}"
              i=$((i+1))
              echo "$text" | piper --model "$m" --length_scale $speed --noise_scale 0.8 --noise_w 0.9 --output_file raw/v$i.wav
              # tiefer, lauter, rau: Tonhöhe runter, Übersteuerung, Kompressor, Hall wie in einem Raum
              sox raw/v$i.wav raw/a$i.wav silence 1 0.01 0.5% reverse silence 1 0.01 0.5% reverse \
                gain -3 pitch -180 overdrive 9 12 bass +5 treble +4 \
                compand 0.005,0.2 -60,-60,-30,-12,-12,-4 -3 \
                pad 0 0.35 reverb 35 50 60 fade 0 0 0.12 gain -n -1
              ffmpeg -loglevel error -y -i raw/a$i.wav -ac 1 -ar 44100 -b:a 112k audio/bljat$i.mp3
              echo "audio/bljat$i.mp3: $text ($m, Tempo $speed)"
            done
          done
          ls -la audio

      - name: Dateien ins Repository übernehmen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audio
          git commit -m "Bljat-Stimme erzeugt (Piper, russisch)" || echo "nichts zu übernehmen"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: bljat-stimme
          path: |
            audio
            raw
