# Lädt kurze, aggressive Männerschreie (CC0) von BigSoundBank herunter, schneidet sie zu,
# macht Varianten (tiefer/rauer) und legt sie als audio/bljat1..4.mp3 ab.
name: Bljat-Schrei erzeugen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sox libsox-fmt-mp3 ffmpeg > /dev/null

      - name: Schreie laden und aufbereiten
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) PokeDurak-Build"
          mkdir -p raw
          rm -rf audio/kandidaten
          rm -f audio/bljat*.mp3
          # 3591 = „Fah“-Schrei, 2361 = „Argh“ eines Mannes (beide CC0, bigsoundbank.com)
          for id in 3591 2361; do
            curl -fsSL -A "$UA" -o "raw/$id.mp3" "https://bigsoundbank.com/UPLOAD/mp3/$id.mp3"
            ffmpeg -loglevel error -y -i "raw/$id.mp3" -ac 1 -ar 44100 "raw/$id.wav"
            sox "raw/$id.wav" "raw/$id-t.wav" silence 1 0.01 1% reverse silence 1 0.01 1% reverse trim 0 1.3
          done
          n=0
          make() {   # make <quelle> <sox-effekte...>
            n=$((n+1)); src=$1; shift
            sox "raw/$src-t.wav" "raw/o$n.wav" "$@"
            sox "raw/o$n.wav" "raw/f$n.wav" fade 0 -0 0.08 gain -n -0.5
            ffmpeg -loglevel error -y -i "raw/f$n.wav" -b:a 112k "audio/bljat$n.mp3"
            echo "audio/bljat$n.mp3 ← $src $* ($(soxi -D raw/f$n.wav) s)"
          }
          make 3591 gain 0
          make 2361 gain 0
          make 3591 pitch -200 overdrive 6 8 bass +4
          make 2361 pitch -250 overdrive 10 10 bass +5 treble +2
          ls -la audio

      - name: Übernehmen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A audio
          git commit -m "Bljat-Schrei: aggressive Männerschreie (BigSoundBank, CC0)" || echo "nichts zu übernehmen"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
