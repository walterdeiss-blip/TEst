<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 160">
  <defs>
    <linearGradient id="map" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity=".1"/></linearGradient>
    <linearGradient id="court" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b7bd9"/><stop offset="1" stop-color="#1c4fa0"/></linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb072"/><stop offset="1" stop-color="#e2641c"/></linearGradient>
    <radialGradient id="ball" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#f6ff9e"/><stop offset=".55" stop-color="#d9f43a"/><stop offset="1" stop-color="#9fbb12"/></radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <!-- Faltkarte -->
  <g filter="url(#sh)">
    <path d="M30 46l50-16 60 16 50-16v94l-50 16-60-16-50 16z" fill="url(#map)" stroke="#fff" stroke-opacity=".5"/>
    <path d="M80 30v94M140 46v94" stroke="#fff" stroke-opacity=".35"/>
    <path d="M38 98c22-10 40 8 62-2s34-30 58-20 24 12 26 10" fill="none" stroke="#2fd3bd" stroke-width="5" stroke-linecap="round" opacity=".8"/>
    <path d="M46 62c16 2 24 14 40 12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 7" opacity=".7"/>
  </g>
  <!-- Mini-Court -->
  <g transform="translate(150 104) rotate(-12)">
    <rect x="-22" y="-13" width="44" height="26" rx="3" fill="url(#court)" stroke="#fff" stroke-width="1.5"/>
    <path d="M0 -15v30M-12 -11v22M12 -11v22" stroke="#fff" stroke-width="1.2" opacity=".85"/>
  </g>
  <!-- Pin mit Ball -->
  <g filter="url(#sh)">
    <path d="M100 18c-17 0-30 13-30 29 0 22 30 50 30 50s30-28 30-50c0-16-13-29-30-29z" fill="url(#pin)"/>
    <circle cx="100" cy="47" r="15" fill="url(#ball)"/>
    <path d="M89 41c5 1 9 5 9 11M111 53c-5-1-9-5-9-11" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  </g>
  <ellipse cx="100" cy="102" rx="14" ry="4" fill="#000" opacity=".25"/>
</svg>
