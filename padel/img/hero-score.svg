    </g>
    <!-- Schläger Team B -->
    <g transform="translate(142 78) rotate(32)">
      <rect x="-7" y="30" width="14" height="52" rx="6" fill="#e9eef5"/>
      <rect x="-7" y="64" width="14" height="18" rx="5" fill="#0d2b52" opacity=".6"/>
      <ellipse cx="0" cy="-8" rx="34" ry="42" fill="url(#rb)"/>
