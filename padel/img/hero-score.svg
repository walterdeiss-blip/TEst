        <circle cx="-17" cy="-12" r="3"/><circle cx="-6" cy="-12" r="3"/><circle cx="6" cy="-12" r="3"/><circle cx="17" cy="-12" r="3"/>
        <circle cx="-12" cy="2" r="3"/><circle cx="0" cy="2" r="3"/><circle cx="12" cy="2" r="3"/>
        <circle cx="-6" cy="15" r="3"/><circle cx="6" cy="15" r="3"/>
