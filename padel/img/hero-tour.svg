<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 160">
  <defs>
    <linearGradient id="court" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b7bd9"/><stop offset="1" stop-color="#1c4fa0"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#d9f43a"/></marker>
  </defs>
  <!-- Mini-Platz in Perspektive -->
  <g filter="url(#sh)" transform="translate(110 84) scale(1 .62) rotate(-90)">
    <rect x="-46" y="-80" width="92" height="160" rx="6" fill="url(#court)"/>
