      <rect x="-40" y="-74" width="80" height="148" rx="2"/>
      <path d="M-40 -50h80M-40 50h80M0 -50v100"/>
    </g>
    <path d="M-50 0h100" stroke="#fff" stroke-width="4"/>
  </g>
  <!-- Spieler -->
  <g stroke="#fff" stroke-width="2.5">
    <circle cx="62" cy="68" r="9" fill="#2fb7a4"/><circle cx="62" cy="102" r="9" fill="#2fb7a4"/>
    <circle cx="158" cy="68" r="9" fill="#f08a3c"/><circle cx="158" cy="102" r="9" fill="#f08a3c"/>
  </g>
  <!-- Rotation -->
  <g fill="none" stroke="#d9f43a" stroke-width="3.5" stroke-linecap="round">
    <path d="M70 30c22-16 58-16 80 0" marker-end="url(#arr)"/>
    <path d="M150 140c-22 16-58 16-80 0" marker-end="url(#arr)"/>
